server {
    listen 8502 ssl http2;
    server_name quality-server.local 192.168.60.9;

    ssl_certificate /Users/quality/yield-analyzer/aim-dt/certs/aim-dt.crt;
    ssl_certificate_key /Users/quality/yield-analyzer/aim-dt/certs/aim-dt.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AIMSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1024m;
    client_body_timeout 3600s;
    send_timeout 3600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /Users/quality/yield-analyzer/aim-dt/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8503;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
